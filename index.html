<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>신축 건물 하자 관리 시스템</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body class="bg-slate-50 text-slate-800 min-h-screen flex flex-col font-sans">

  <nav class="bg-slate-900 text-white shadow-md">
    <div class="max-w-6xl mx-auto px-4 py-3 flex justify-between items-center">
      <div class="flex items-center space-x-2">
        <span class="text-xl font-bold text-indigo-400">BUILD-CARE</span>
        <span class="text-xs bg-slate-700 text-slate-300 px-2 py-0.5 rounded">신축 하자 관리 시스템</span>
      </div>
      <div id="nav-user-info" class="hidden items-center space-x-4">
        <span id="user-badge" class="text-sm font-medium px-2.5 py-1 rounded bg-indigo-900 text-indigo-200"></span>
        <button onclick="handleLogout()" class="text-sm text-slate-400 hover:text-white">로그아웃</button>
      </div>
    </div>
  </nav>

  <main class="max-w-6xl mx-auto px-4 py-8 flex-1 w-full">
    <div id="section-auth" class="max-w-md mx-auto bg-white p-8 rounded-xl shadow-lg border border-slate-100">
      <div id="form-login">
        <h2 class="text-2xl font-bold mb-6 text-slate-900 text-center">로그인</h2>
        <form onsubmit="handleLogin(event)" class="space-y-4">
          <div>
            <label class="block text-sm font-medium text-slate-700 mb-1">이메일</label>
            <input type="email" id="login-email" required class="w-full px-3 py-2 border rounded-lg focus:outline-none focus:ring-2 focus:ring-indigo-500">
          </div>
          <div>
            <label class="block text-sm font-medium text-slate-700 mb-1">비밀번호</label>
            <input type="password" id="login-password" required class="w-full px-3 py-2 border rounded-lg focus:outline-none focus:ring-2 focus:ring-indigo-500">
          </div>
          <button type="submit" class="w-full bg-indigo-600 hover:bg-indigo-700 text-white font-medium py-2.5 rounded-lg">로그인</button>
        </form>
        <p class="mt-4 text-center text-sm text-slate-500">
          계정이 없으신가요? <button onclick="toggleAuthMode('register')" class="text-indigo-600 font-medium hover:underline">회원가입</button>
        </p>
      </div>

      <div id="form-register" class="hidden">
        <h2 class="text-2xl font-bold mb-6 text-slate-900 text-center">회원가입 신청</h2>
        <form onsubmit="handleRegister(event)" class="space-y-4">
          <div>
            <label class="block text-sm font-medium text-slate-700 mb-1">이메일</label>
            <input type="email" id="reg-email" required class="w-full px-3 py-2 border rounded-lg focus:outline-none">
          </div>
          <div>
            <label class="block text-sm font-medium text-slate-700 mb-1">비밀번호</label>
            <input type="password" id="reg-password" required class="w-full px-3 py-2 border rounded-lg focus:outline-none">
          </div>
          <div>
            <label class="block text-sm font-medium text-slate-700 mb-1">이름</label>
            <input type="text" id="reg-name" required class="w-full px-3 py-2 border rounded-lg focus:outline-none">
          </div>
          <div>
            <label class="block text-sm font-medium text-slate-700 mb-1">회원 구분</label>
            <select id="reg-role" onchange="handleRoleChange()" class="w-full px-3 py-2 border rounded-lg focus:outline-none">
              <option value="tenant">입주자/소유자</option>
              <option value="vendor">협력업체 (시공/시행/신탁 등)</option>
              <option value="admin">최고 관리자 (마스터)</option>
            </select>
          </div>
          <div id="field-tenant" class="space-y-2">
            <label class="block text-sm font-medium text-slate-700">동/호수 정보</label>
            <div class="grid grid-cols-2 gap-2">
              <input type="text" id="reg-building" placeholder="예: 101동" class="px-3 py-2 border rounded-lg">
              <input type="text" id="reg-unit" placeholder="예: 502호" class="px-3 py-2 border rounded-lg">
            </div>
          </div>
          <div id="field-vendor" class="hidden">
            <label class="block text-sm font-medium text-slate-700 mb-1">담당 분야 / 업체명</label>
            <input type="text" id="reg-vendor-type" placeholder="예: 타일공사, 창호, 시행사" class="w-full px-3 py-2 border rounded-lg">
          </div>
          <button type="submit" class="w-full bg-indigo-600 hover:bg-indigo-700 text-white font-medium py-2.5 rounded-lg">가입 신청</button>
        </form>
        <p class="mt-4 text-center text-sm text-slate-500">
          이미 계정이 있으신가요? <button onclick="toggleAuthMode('login')" class="text-indigo-600 font-medium hover:underline">로그인</button>
        </p>
      </div>
    </div>

    <!-- 2. ADMIN DASHBOARD -->
    <div id="dashboard-admin" class="hidden space-y-6">
      <div class="bg-white p-6 rounded-xl shadow-sm border border-slate-200">
        <h2 class="text-xl font-bold mb-4 text-slate-900 flex items-center">
          <span class="w-2 h-6 bg-indigo-600 rounded-full mr-3"></span>
          마스터 전용: 가입 승인 대기 회원 목록
        </h2>
        <div class="overflow-x-auto">
          <table class="w-full text-left border-collapse">
            <thead>
              <tr class="border-b border-slate-200 bg-slate-50 text-slate-600 text-sm">
                <th class="p-3">이름</th>
                <th class="p-3">이메일</th>
                <th class="p-3">구분</th>
                <th class="p-3">세부정보</th>
                <th class="p-3">승인 처리</th>
              </tr>
            </thead>
            <tbody id="admin-pending-users" class="divide-y divide-slate-100 text-sm">
            </tbody>
          </table>
        </div>
      </div>
    </div>

    <!-- 3. TENANT DASHBOARD -->
    <div id="dashboard-tenant" class="hidden space-y-8">
      <div class="bg-white p-6 rounded-xl shadow-sm border border-slate-200">
        <h2 class="text-xl font-bold mb-4 text-slate-900 flex items-center">
          <span class="w-2 h-6 bg-indigo-600 rounded-full mr-3"></span>
          신규 하자 접수 신청
        </h2>
        <form onsubmit="handleCreateDefect(event)" class="space-y-4">
          <div>
            <label class="block text-sm font-medium text-slate-700 mb-1">하자 제목</label>
            <input type="text" id="defect-title" required placeholder="예: 거실 창호 누수" class="w-full px-3 py-2 border rounded-lg">
          </div>
          <div>
            <label class="block text-sm font-medium text-slate-700 mb-1">상세 내용</label>
            <textarea id="defect-desc" rows="3" required placeholder="하자 상태 설명" class="w-full px-3 py-2 border rounded-lg"></textarea>
          </div>
          <button type="submit" class="bg-indigo-600 text-white px-5 py-2 rounded-lg">하자 접수하기</button>
        </form>
      </div>
    </div>
  </main>

  <script>
    const SUPABASE_URL = "https://fvgkdiwmnhblybucdmup.supabase.co";
    const SUPABASE_ANON_KEY = "sb_publishable_3sUaE_iy8fY74EKX6fVfAQ_cU2svZvd";
    const db = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

    let currentUser = null;
    let currentProfile = null;

    function toggleAuthMode(m){ document.getElementById('form-login').classList.toggle('hidden', m==='register'); document.getElementById('form-register').classList.toggle('hidden', m==='login'); }
    function handleRoleChange(){ const r=document.getElementById('reg-role').value; document.getElementById('field-tenant').classList.toggle('hidden', r!=='tenant'); document.getElementById('field-vendor').classList.toggle('hidden', r!=='vendor'); }

    async function handleRegister(e) {
      e.preventDefault();
      const email = document.getElementById('reg-email').value;
      const password = document.getElementById('reg-password').value;
      const name = document.getElementById('reg-name').value;
      const role = document.getElementById('reg-role').value;

      try {
        const { data, error } = await db.auth.signUp({ email, password });
        if (error) throw error;

        // 최고 관리자는 자동으로 바로 승인(is_approved = true) 처리
        const autoApprove = (role === 'admin');

        await db.from('profiles').insert([{
          id: data.user.id,
          email: email,
          name: name,
          role: role,
          is_approved: autoApprove
        }]);

        if (autoApprove) {
          alert('마스터 관리자 계정이 생성되었습니다! 바로 로그인해 주세요.');
        } else {
          alert('가입 신청이 완료되었습니다. 관리자 승인 후 로그인 가능합니다.');
        }
        toggleAuthMode('login');
      } catch (err) {
        alert('오류: ' + err.message);
      }
    }

    async function handleLogin(e) {
      e.preventDefault();
      const email = document.getElementById('login-email').value;
      const password = document.getElementById('login-password').value;

      try {
        const { data, error } = await db.auth.signInWithPassword({ email, password });
        if (error) throw error;

        const { data: profile } = await db.from('profiles').select('*').eq('id', data.user.id).single();

        if (profile && !profile.is_approved) {
          await db.auth.signOut();
          alert('아직 관리자의 가입 승인이 안 된 계정입니다.');
          return;
        }

        currentProfile = profile;
        document.getElementById('section-auth').classList.add('hidden');
        document.getElementById('nav-user-info').classList.remove('hidden');
        document.getElementById('nav-user-info').classList.add('flex');
        document.getElementById('user-badge').textContent = `${profile.name} (${profile.role === 'admin' ? '마스터' : '회원'})`;

        if (profile.role === 'admin') {
          document.getElementById('dashboard-admin').classList.remove('hidden');
          loadPendingUsers();
        } else {
          document.getElementById('dashboard-tenant').classList.remove('hidden');
        }
      } catch (err) {
        alert('로그인 실패: ' + err.message);
      }
    }

    async function loadPendingUsers() {
      const { data: pendingUsers } = await db.from('profiles').select('*').eq('is_approved', false);
      const tbody = document.getElementById('admin-pending-users');
      tbody.innerHTML = '';
      if (!pendingUsers || pendingUsers.length === 0) {
        tbody.innerHTML = `<tr><td colspan="5" class="p-4 text-center text-slate-400">승인 대기 중인 회원이 없습니다.</td></tr>`;
        return;
      }
      pendingUsers.forEach(u => {
        const tr = document.createElement('tr');
        tr.innerHTML = `
          <td class="p-3">${u.name}</td>
          <td class="p-3">${u.email}</td>
          <td class="p-3">${u.role}</td>
          <td class="p-3">-</td>
          <td class="p-3"><button onclick="approveUser('${u.id}')" class="bg-emerald-600 text-white text-xs px-3 py-1.5 rounded">승인하기</button></td>
        `;
        tbody.appendChild(tr);
      });
    }

    async function approveUser(userId) {
      await db.from('profiles').update({ is_approved: true }).eq('id', userId);
      alert('승인되었습니다.');
      loadPendingUsers();
    }

    function handleLogout() { location.reload(); }
  </script>
</body>
</html>
